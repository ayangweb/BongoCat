name: Verify

on:
  # Pull requests only.
  #
  # A `push: master` trigger was tried, so the base branch's cache scope would be
  # filled and pull requests could restore from it. It did not pay off: the
  # repository's 10 GB cache budget was already over (10.69 GB across 26
  # entries), so the two largest entries were evicted as newer ones were written
  # and the master scope never held them. Pull requests were cold either way, and
  # the extra run after every merge only read as a second, unexplained
  # verification. See ADR-0074 for the measurement.
  pull_request:

# A superseded run on the same ref can only burn runner minutes: its result is
# replaced by the next push.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides once whether this change can only have touched documentation, and is
  # the only job that never skips. A skipped job reports as *skipped*, which
  # satisfies a required check without hanging, so every job below is gated here
  # rather than at the workflow level: a workflow-level `paths:` that matches
  # nothing runs nothing at all, and the pull request then waits forever for a
  # status that is never reported.
  filter-paths:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The default shallow clone has no base branch in it, and an unreadable
          # diff classifies as "not documentation", which runs everything — so a
          # wrong depth costs time rather than coverage.
          fetch-depth: 0
      - name: Classify the change
        id: classify
        run: python3 tools/changed-paths.py
      - name: Collect redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: python3 tools/collect-failure-evidence.py --input "$RUNNER_TEMP" --output "$RUNNER_TEMP/bongocat-failure-evidence" --platform "${{ runner.os }}"
      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-filter-paths
          path: ${{ runner.temp }}/bongocat-failure-evidence
          if-no-files-found: error
          retention-days: 7

  toolchain:
    name: Verify Rust toolchains
    if: needs.filter-paths.outputs.docs-only != 'true'
    needs: filter-paths
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # `rust-toolchain.toml` pins 1.97.1, so a bare `cargo` here always resolves
      # to the pinned toolchain and the stable check below silently repeated the
      # minimum one. `+stable` and a separate target directory make the canary
      # real, and keep the two compilers from invalidating each other's cache.
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          # Only this job's stable canary. The pinned toolchain gets no second
          # copy: `rust-toolchain.toml` selects it for every other job, and the
          # workspace job already compiles the whole workspace with it on both
          # platforms, so building it again under a second target directory
          # bought nothing.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/toolchain-stable/
          key: ${{ runner.os }}-toolchain-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
      - name: Check current stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build workspace with current stable
        run: cargo +stable check --manifest-path Cargo.toml --locked --workspace --target-dir target/toolchain-stable
      - name: Collect redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: python3 tools/collect-failure-evidence.py --input "$RUNNER_TEMP" --output "$RUNNER_TEMP/bongocat-failure-evidence" --platform "${{ runner.os }}"
      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-toolchain
          path: ${{ runner.temp }}/bongocat-failure-evidence
          if-no-files-found: error
          retention-days: 7

  fixtures:
    name: Validate shared fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned schema validator
        run: python3 -m pip install --disable-pip-version-check --requirement tools/requirements.txt
      - name: Validate fixture structure and model cases
        run: python3 tools/validate-fixtures.py
      - name: Validate Draft 2020-12 schemas
        run: python3 tools/validate-json-schema.py
      - name: Validate locale keys and placeholders
        run: python3 tools/validate-locales.py
      - name: Run deterministic input fixtures
        run: python3 tools/run-input-fixtures.py
      - name: Run tool contract tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check
      - name: Collect redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: python3 tools/collect-failure-evidence.py --input "$RUNNER_TEMP" --output "$RUNNER_TEMP/bongocat-failure-evidence" --platform "${{ runner.os }}"
      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-fixtures
          path: ${{ runner.temp }}/bongocat-failure-evidence
          if-no-files-found: error
          retention-days: 7

  dependency-policy:
    name: Check dependency policy
    if: needs.filter-paths.outputs.docs-only != 'true'
    needs: filter-paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deny-0.20.2-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'deny.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-0.20.2-
      - name: Install pinned cargo-deny
        shell: bash
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fxq 'cargo-deny 0.20.2'; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
      - name: Check licenses and dependency sources
        run: ./tools/check-dependencies.sh
      - name: Collect redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: python3 tools/collect-failure-evidence.py --input "$RUNNER_TEMP" --output "$RUNNER_TEMP/bongocat-failure-evidence" --platform "${{ runner.os }}"
      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-dependency-policy
          path: ${{ runner.temp }}/bongocat-failure-evidence
          if-no-files-found: error
          retention-days: 7

  workspace:
    name: Test workspace (${{ matrix.os }})
    if: needs.filter-paths.outputs.docs-only != 'true'
    needs: filter-paths
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: taiki-e/install-action@just
        if: matrix.os == 'macos-latest'
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          # `target/release/` here holds only the metadata the two release
          # `cargo check` steps produce, which is a few hundred MB against the
          # gigabytes of code the smoke jobs link. Keeping it means the release
          # check does not redo 189 crates on every run, and the product caches
          # carry the codegen side.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/debug/
            target/release/
          key: ${{ runner.os }}-workspace-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-workspace-
      - name: Check formatting
        run: cargo fmt --manifest-path Cargo.toml --all -- --check
      - name: Run Clippy
        run: |
          cargo clippy --manifest-path Cargo.toml --locked --workspace --all-targets --all-features --exclude bongocat-app -- -D warnings
          cargo clippy --manifest-path Cargo.toml --locked -p bongocat-app --all-targets --features storage-test-injection -- -D warnings
          cargo clippy --manifest-path Cargo.toml --locked -p bongocat-app --all-targets --features production -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path Cargo.toml --locked --workspace
      - name: Check release build
        run: cargo check --manifest-path Cargo.toml --locked --workspace --release
      - name: Check production environment build
        run: cargo check --manifest-path Cargo.toml --locked -p bongocat-app --release --features production
      - name: Record build provenance
        shell: bash
        run: |
          python3 tools/record-provenance.py \
            --workspace . \
            --output "target/provenance/${RUNNER_OS}.json" \
            --profile release \
            --features default \
            --environment development
      - name: Upload build provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance-${{ matrix.os }}
          path: target/provenance/${{ runner.os }}.json
          if-no-files-found: error
      - name: Collect redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: python3 tools/collect-failure-evidence.py --input "$RUNNER_TEMP" --output "$RUNNER_TEMP/bongocat-failure-evidence" --platform "${{ runner.os }}"
      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-workspace-${{ matrix.os }}
          path: ${{ runner.temp }}/bongocat-failure-evidence
          if-no-files-found: error
          retention-days: 7

  product-smoke:
    name: Smoke product (${{ matrix.os }})
    if: needs.filter-paths.outputs.docs-only != 'true'
    needs: filter-paths
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/release/
          key: ${{ runner.os }}-product-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-product-
      - name: Smoke Windows model directory picker
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 6
        env:
          RUST_BACKTRACE: full
        run: |
          cargo run --manifest-path Cargo.toml --locked --release -p bongocat-platform --example model_source_picker_smoke -- --expect-cancel --auto
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          # A model source is recognised from its own content, so the harness takes
          # no kind: a folder is what the picker asks for on both platforms.
          cargo run --manifest-path Cargo.toml --locked --release -p bongocat-platform --example model_source_picker_smoke -- --expect-selected-any --auto
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Smoke Windows D3D11 product overlay
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # This step owns the first release link of `bongocat-app` in this job,
        # and `cargo check --release` in the workspace job produces metadata
        # rather than code, so nothing warms the linker ahead of it. That build
        # alone has run past 12 minutes on this runner, and the five 30-second
        # product runs follow it. Budget the build and the runs, the way the
        # storage-injection build below does.
        timeout-minutes: 30
        env:
          RUST_BACKTRACE: full
        run: |
          cargo build --manifest-path Cargo.toml --locked -p bongocat-app --release
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $executable = Join-Path $PWD "target/release/bongocat-app.exe"
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName UIAutomationClient
          function Find-UiAutomationElement {
            param(
              [System.Windows.Automation.AutomationElement] $Owner,
              [System.Windows.Automation.TreeScope] $Scope,
              [System.Windows.Automation.Condition] $Condition
            )
            try {
              return $Owner.FindFirst($Scope, $Condition)
            } catch {
              # GPUI can rebuild its UIA subtree after a settings snapshot
              # update. PowerShell commonly wraps the resulting COMException
              # (including E_UNEXPECTED) in MethodInvocationException.
              $exception = $_.Exception
              while ($null -ne $exception) {
                if ($exception -is [System.Runtime.InteropServices.COMException]) {
                  if ($exception.HResult -eq -2147418113) {
                    return $null
                  }
                  throw
                }
                $exception = $exception.InnerException
              }
              throw
            }
          }
          $childrenScope = [System.Windows.Automation.TreeScope]::Children
          1..5 | ForEach-Object {
            $stdout = Join-Path $env:RUNNER_TEMP "bongocat-product-$_.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "bongocat-product-$_.stderr.log"
            $arguments = if ($_ -eq 1) {
              @("--run-seconds", "30", "--settings-window-open-smoke")
            } else {
              @("--run-seconds", "30", "--settings-window-smoke", "--models-page-smoke")
            }
            $process = Start-Process `
              -FilePath $executable `
              -ArgumentList $arguments `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            if ($_ -eq 1) {
              $windowDeadline = [DateTime]::UtcNow.AddSeconds(10)
              $processCondition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
                $process.Id
              )
              $windowNameCondition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,
                "BongoCat Settings"
              )
              $settingsWindowCondition = [System.Windows.Automation.AndCondition]::new(
                $processCondition,
                $windowNameCondition
              )
              do {
                Start-Sleep -Milliseconds 100
                $process.Refresh()
                if ($process.HasExited) {
                  Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                  throw "Windows product exited before UI Automation inspection"
                }
                $root = Find-UiAutomationElement `
                  -Owner ([System.Windows.Automation.AutomationElement]::RootElement) `
                  -Scope $childrenScope `
                  -Condition $settingsWindowCondition
              } while ($null -eq $root -and [DateTime]::UtcNow -lt $windowDeadline)
              if ($null -eq $root) {
                throw "Windows product did not expose a settings HWND"
              }
              # The settings window is the product behaviour this step verifies:
              # the run opened it, as a real top-level window with this
              # process behind it, and the bounded run below then finishes on its
              # own. It deliberately stops there. Asserting a control's accessible
              # name, control type, ARIA role and toggle pattern is an
              # accessibility-tree assertion, which ADR-0054 rules out as a
              # completion criterion for this product: the settings rows are plain
              # labels and fields and carry no accessibility node of their own, and
              # UIA is not a UI contract BongoCat owns. Accessibility behaviour is
              # covered where it does exist, by the product's own settings-window
              # smoke, against the components that actually carry it.
            }
            if (!$process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Windows product lifecycle smoke $_ exceeded 60 seconds"
            }
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) {
              exit $process.ExitCode
            }
          }
      - name: Smoke macOS settings window lifecycle
        if: matrix.os == 'macos-latest'
        timeout-minutes: 30
        run: |
          cargo build --manifest-path Cargo.toml --locked -p bongocat-app --release
          target/release/bongocat-app --run-seconds 8 --settings-window-smoke --models-page-smoke
      - name: Smoke hidden overlay model switching
        if: matrix.os != 'ubuntu-latest'
        timeout-minutes: 5
        shell: bash
        run: |
          cargo build --manifest-path Cargo.toml --locked -p bongocat-app --release
          if [ -f target/release/bongocat-app.exe ]; then
            target/release/bongocat-app.exe --run-seconds 20 --hidden-model-switch-smoke
          else
            target/release/bongocat-app --run-seconds 20 --hidden-model-switch-smoke
          fi
      - name: Smoke Windows single-instance wake
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $executable = Join-Path $PWD "target/release/bongocat-app.exe"
          $primaryStdout = Join-Path $env:RUNNER_TEMP "single-instance-primary.stdout.log"
          $primaryStderr = Join-Path $env:RUNNER_TEMP "single-instance-primary.stderr.log"
          $secondaryStdout = Join-Path $env:RUNNER_TEMP "single-instance-secondary.stdout.log"
          $secondaryStderr = Join-Path $env:RUNNER_TEMP "single-instance-secondary.stderr.log"
          $readyMarker = Join-Path $env:RUNNER_TEMP "single-instance-primary.ready"
          $primaryResultMarker = Join-Path $env:RUNNER_TEMP "single-instance-primary.result"
          $secondaryResultMarker = Join-Path $env:RUNNER_TEMP "single-instance-secondary.result"
          Remove-Item `
            $primaryStdout, $primaryStderr, $secondaryStdout, $secondaryStderr, `
            $readyMarker, $primaryResultMarker, $secondaryResultMarker `
            -Force `
            -ErrorAction SilentlyContinue

          $primary = Start-Process `
            -FilePath $executable `
            -ArgumentList @(
              # The smoke waits half a second, then up to three to see its window
              # destroyed, then up to five for the wake to deliver a snapshot. A
              # ten second run could expire mid-poll and look like a failed wake.
              "--run-seconds", "30",
              "--single-instance-smoke",
              "--single-instance-ready-file", $readyMarker,
              "--single-instance-result-file", $primaryResultMarker
            ) `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $primaryStdout `
            -RedirectStandardError $primaryStderr
          $readyDeadline = [DateTime]::UtcNow.AddSeconds(15)
          do {
            Start-Sleep -Milliseconds 100
            $primary.Refresh()
          } while (
            -not (Test-Path $readyMarker -PathType Leaf) -and
            -not $primary.HasExited -and
            [DateTime]::UtcNow -lt $readyDeadline
          )
          if (-not (Test-Path $readyMarker -PathType Leaf)) {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            $primary.WaitForExit()
            Write-Host (Get-Content $primaryStdout -Raw -ErrorAction SilentlyContinue)
            Write-Host (Get-Content $primaryStderr -Raw -ErrorAction SilentlyContinue)
            throw "primary instance did not reach the hidden-window wake gate"
          }
          $readyStatus = (Get-Content $readyMarker -Raw).Trim()
          if ($readyStatus -ne "single-instance primary ready") {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            $primary.WaitForExit()
            throw "primary instance wrote an unexpected ready status: $readyStatus"
          }

          $secondary = Start-Process `
            -FilePath $executable `
            -ArgumentList @(
              "--run-seconds", "1",
              "--single-instance-smoke",
              "--single-instance-result-file", $secondaryResultMarker
            ) `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $secondaryStdout `
            -RedirectStandardError $secondaryStderr
          if (-not $secondary.WaitForExit(10000)) {
            Stop-Process -Id $secondary.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            throw "secondary instance did not exit after notifying the primary"
          }
          Write-Host (Get-Content $secondaryStdout -Raw -ErrorAction SilentlyContinue)
          Write-Host (Get-Content $secondaryStderr -Raw -ErrorAction SilentlyContinue)
          if ($secondary.ExitCode -ne 0) {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            throw "secondary instance exited with $($secondary.ExitCode)"
          }
          if (-not (Test-Path $secondaryResultMarker -PathType Leaf)) {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            throw "secondary instance did not report a successful primary notification"
          }
          $secondaryStatus = (Get-Content $secondaryResultMarker -Raw).Trim()
          if ($secondaryStatus -ne "secondary instance notified primary") {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            throw "secondary instance wrote an unexpected result status: $secondaryStatus"
          }

          # Longer than the run duration above, so an orderly shutdown is what ends
          # this wait rather than the bound being reached at the same moment.
          if (-not $primary.WaitForExit(60000)) {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            $primary.WaitForExit()
            throw "primary instance did not finish ordered shutdown after the wake"
          }
          Write-Host (Get-Content $primaryStdout -Raw -ErrorAction SilentlyContinue)
          Write-Host (Get-Content $primaryStderr -Raw -ErrorAction SilentlyContinue)
          if ($primary.ExitCode -ne 0) {
            throw "primary instance exited with $($primary.ExitCode)"
          }
          if (-not (Test-Path $primaryResultMarker -PathType Leaf)) {
            throw "primary instance did not restore the existing settings window after the wake"
          }
          $primaryStatus = (Get-Content $primaryResultMarker -Raw).Trim()
          if ($primaryStatus -ne "single-instance wake restored the settings window") {
            throw "primary instance wrote an unexpected result status: $primaryStatus"
          }
      - name: Verify Windows executable product icon
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "target/release/bongocat-app.exe"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class BongoCatIconProbe
          {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(
                  string fileName,
                  int iconIndex,
                  IntPtr[] largeIcons,
                  IntPtr[] smallIcons,
                  uint iconCount);
          }
          '@
          $iconCount = [BongoCatIconProbe]::ExtractIconEx(
            $executable,
            -1,
            $null,
            $null,
            0)
          if ($iconCount -lt 1) {
            throw "Windows executable does not contain a product icon"
          }
      - name: Smoke native system menu lifecycle
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        # The release binary was built by an earlier step; this only runs it.
        shell: bash
        timeout-minutes: 10
        run: |
          cargo build --manifest-path Cargo.toml --locked -p bongocat-app --release
          if [ -f target/release/bongocat-app.exe ]; then
            target/release/bongocat-app.exe --run-seconds 10 --system-menu-smoke
          else
            target/release/bongocat-app --run-seconds 10 --system-menu-smoke
          fi
      - name: Build isolated storage smoke executable
        if: matrix.os != 'ubuntu-latest'
        # `storage-test-injection` is a leaf feature of `bongocat-app`, so this
        # used to share nothing with the build above and recompiled the whole
        # release dependency graph into a second target directory: 14 minutes on
        # Windows and 8 on macOS, per run. Building into the same directory
        # relinks one crate instead, and the copy keeps the storage smokes on a
        # binary of their own.
        shell: bash
        timeout-minutes: 30
        run: |
          cargo build --manifest-path Cargo.toml --locked -p bongocat-app --release --features storage-test-injection
          mkdir -p target/storage-smoke
          if [ -f target/release/bongocat-app.exe ]; then
            cp target/release/bongocat-app.exe target/storage-smoke/bongocat-app.exe
          else
            cp target/release/bongocat-app target/storage-smoke/bongocat-app
          fi
      - name: Smoke macOS settings window state restore
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: |
          set +e
          output=$(target/storage-smoke/bongocat-app --settings-window-state-smoke 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if ((status != 0)); then
            exit "$status"
          fi
          grep -Fq 'bongocat-app: Chinese Appearance and language localization verified' <<<"$output"
          grep -Fq 'bongocat-app: Chinese Model library localization verified' <<<"$output"
          grep -Fq 'bongocat-app: settings window state restored after restart' <<<"$output"
      - name: Smoke macOS release panic diagnostics
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: |
          output=$(target/storage-smoke/bongocat-app --panic-diagnostics-smoke 2>&1)
          printf '%s\n' "$output"
          grep -Fq 'bongocat-app: panic diagnostics recovered after crash' <<<"$output"
      - name: Smoke macOS diagnostics preview export
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: |
          output=$(target/storage-smoke/bongocat-app --diagnostics-export-smoke 2>&1)
          printf '%s\n' "$output"
          grep -Fq 'bongocat-app: diagnostics export completed with a private preview bundle' <<<"$output"
      - name: Smoke macOS diagnostics export filesystem failures
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: |
          output=$(target/storage-smoke/bongocat-app --diagnostics-export-failure-smoke 2>&1)
          printf '%s\n' "$output"
          grep -Fq 'bongocat-app: diagnostics export filesystem failures preserved the previous bundle' <<<"$output"
      - name: Smoke Windows settings window state restore
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $executable = Join-Path $PWD "target/storage-smoke/bongocat-app.exe"
          if (-not (Test-Path $executable)) {
            throw "storage injection smoke executable was not built"
          }
          $stateStdout = Join-Path $env:RUNNER_TEMP "bongocat-settings-window-state.stdout.log"
          $stateStderr = Join-Path $env:RUNNER_TEMP "bongocat-settings-window-state.stderr.log"
          Remove-Item $stateStdout, $stateStderr -Force -ErrorAction SilentlyContinue
          $stateProcess = Start-Process `
            -FilePath $executable `
            -ArgumentList @("--settings-window-state-smoke") `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $stateStdout `
            -RedirectStandardError $stateStderr
          if (-not $stateProcess.WaitForExit(20000)) {
            Stop-Process -Id $stateProcess.Id -Force -ErrorAction SilentlyContinue
            throw "Windows settings window state smoke exceeded 20 seconds"
          }
          $stateOutput = @(
            Get-Content $stateStdout -Raw -ErrorAction SilentlyContinue
            Get-Content $stateStderr -Raw -ErrorAction SilentlyContinue
          ) -join "`n"
          Write-Host $stateOutput
          if ($stateProcess.ExitCode -ne 0) { throw "Windows settings window state smoke exited with $($stateProcess.ExitCode)" }
          if (-not $stateOutput.Contains("bongocat-app: settings window state restored after restart")) {
            throw "Windows settings window state smoke did not report restart restore"
          }
          if (-not $stateOutput.Contains("bongocat-app: Chinese Appearance and language localization verified")) {
            throw "Windows settings window state smoke did not verify Chinese Appearance and language localization"
          }
          if (-not $stateOutput.Contains("bongocat-app: Chinese Model library localization verified")) {
            throw "Windows settings window state smoke did not verify Chinese Models localization"
          }
      - name: Smoke Windows release panic diagnostics
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $output = & target/storage-smoke/bongocat-app.exe --panic-diagnostics-smoke 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -ne 0) { exit $exitCode }
          if (-not $output.Contains("bongocat-app: panic diagnostics recovered after crash")) {
            throw "Windows panic diagnostics smoke did not report recovery"
          }
      - name: Smoke Windows diagnostics preview export
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $output = & target/storage-smoke/bongocat-app.exe --diagnostics-export-smoke 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -ne 0) { exit $exitCode }
          if (-not $output.Contains("bongocat-app: diagnostics export completed with a private preview bundle")) {
            throw "Windows diagnostics export smoke did not report a private preview bundle"
          }
      - name: Smoke Windows diagnostics export filesystem failures
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $output = & target/storage-smoke/bongocat-app.exe --diagnostics-export-failure-smoke 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -ne 0) { exit $exitCode }
          if (-not $output.Contains("bongocat-app: diagnostics export filesystem failures preserved the previous bundle")) {
            throw "Windows diagnostics export failure smoke did not preserve the previous bundle"
          }
      - name: Collect redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: python3 tools/collect-failure-evidence.py --input "$RUNNER_TEMP" --output "$RUNNER_TEMP/bongocat-failure-evidence" --platform "${{ runner.os }}"
      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-product-${{ matrix.os }}
          path: ${{ runner.temp }}/bongocat-failure-evidence
          if-no-files-found: error
          retention-days: 7

  windows-platform-smoke:
    name: Smoke Windows platform release behaviour
    if: needs.filter-paths.outputs.docs-only != 'true'
    needs: filter-paths
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Restore Cargo artifacts
        # Read-only on purpose: this job adds two test harnesses and one overlay
        # binary to a release tree the `product-smoke` cache already holds, so
        # storing it again would spend another 1.4 GB of the repository's 10 GB
        # budget on a subset of the same artifacts.
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/release/
          key: ${{ runner.os }}-product-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-product-
      - name: Smoke Windows startup item lifecycle
        run: cargo test --manifest-path Cargo.toml --locked --release -p bongocat-platform windows_startup_item_registry_smoke_restores_original_value -- --ignored
      - name: Smoke formal Windows missing-release recovery
        run: cargo test --manifest-path Cargo.toml --locked -p bongocat-platform --lib --release windows::tests::synthetic_missing_release_is_reconciled_in_formal_runtime -- --ignored --exact
      # The retired `windows-input-spike` job was the only caller of this
      # example. Keep the WGI context startup/shutdown evidence on the real
      # Windows runner without reviving the spike workspace.
      - name: Smoke Windows gilrs gamepad context startup and shutdown (no-device)
        run: cargo run --manifest-path Cargo.toml --locked -p bongocat-platform --example gilrs_gamepad_smoke
      - name: Smoke transactional Windows D3D11 model switching
        run: cargo run --manifest-path Cargo.toml --locked -p bongocat-overlay --release -- standard 0 --switch-cycles 3
      - name: Collect redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: python3 tools/collect-failure-evidence.py --input "$RUNNER_TEMP" --output "$RUNNER_TEMP/bongocat-failure-evidence" --platform "${{ runner.os }}"
      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-windows-platform
          path: ${{ runner.temp }}/bongocat-failure-evidence
          if-no-files-found: error
          retention-days: 7
  cubism-binding-contract:
    name: Check Cubism binding generation contract
    if: needs.filter-paths.outputs.docs-only != 'true'
    needs: filter-paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Hash Rust toolchain
        id: rust-toolchain
        shell: python
        run: |
          import hashlib
          import os
          import subprocess

          version = subprocess.check_output(["rustc", "-Vv"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"hash={hashlib.sha256(version).hexdigest()}\n")
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            tools/cubism-bindgen/target/
          key: ${{ runner.os }}-cubism-bindgen-${{ steps.rust-toolchain.outputs.hash }}-${{ hashFiles('tools/cubism-bindgen/Cargo.lock', 'tools/cubism-bindgen/Cargo.toml', 'tools/cubism-core-probe/Cargo.lock', 'tools/cubism-core-probe/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cubism-bindgen-${{ steps.rust-toolchain.outputs.hash }}-
            ${{ runner.os }}-cubism-bindgen-
      - name: Check formatting
        run: cargo fmt --manifest-path tools/cubism-bindgen/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/cubism-bindgen/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path tools/cubism-bindgen/Cargo.toml --locked
      - name: Check deterministic synthetic bindings
        run: cargo run --manifest-path tools/cubism-bindgen/Cargo.toml --locked -- check-fixtures
      - name: Compile Core probe against synthetic bindings
        env:
          BONGOCAT_CUBISM_BINDINGS: ${{ github.workspace }}/tools/cubism-bindgen/fixtures/expected/x86_64-pc-windows-msvc.rs
        run: |
          cargo fmt --manifest-path tools/cubism-core-probe/Cargo.toml -- --check
          cargo clippy --manifest-path tools/cubism-core-probe/Cargo.toml --locked --all-targets --target-dir tools/cubism-bindgen/target/core-probe -- -D warnings
          cargo check --manifest-path tools/cubism-core-probe/Cargo.toml --locked --release --target-dir tools/cubism-bindgen/target/core-probe
      - name: Compile synthetic bindings for every Core target
        shell: bash
        run: |
          rustup target add \
            x86_64-pc-windows-msvc \
            aarch64-apple-darwin \
            x86_64-apple-darwin
          output_directory=$(mktemp -d)
          for target in \
            x86_64-pc-windows-msvc \
            aarch64-apple-darwin \
            x86_64-apple-darwin; do
            mkdir -p "$output_directory/$target"
            rustc \
              --crate-name cubism_core_synthetic \
              --crate-type lib \
              --edition 2024 \
              --target "$target" \
              --emit metadata \
              -D warnings \
              -A non_camel_case_types \
              -A non_snake_case \
              -A non_upper_case_globals \
              "tools/cubism-bindgen/fixtures/expected/$target.rs" \
              --out-dir "$output_directory/$target"
          done
      - name: Check release build
        run: cargo check --manifest-path tools/cubism-bindgen/Cargo.toml --locked --release
      - name: Collect redacted failure evidence
        if: ${{ failure() }}
        shell: bash
        run: python3 tools/collect-failure-evidence.py --input "$RUNNER_TEMP" --output "$RUNNER_TEMP/bongocat-failure-evidence" --platform "${{ runner.os }}"
      - name: Upload redacted failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-cubism-binding
          path: ${{ runner.temp }}/bongocat-failure-evidence
          if-no-files-found: error
          retention-days: 7
