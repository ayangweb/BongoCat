      - name: Check GPUI spike formatting
        run: |
          cargo fmt --manifest-path spikes/gpui-settings/Cargo.toml -- --check
          cargo fmt --manifest-path spikes/gpui-overlay-macos/Cargo.toml -- --check
      - name: Check macOS input spike formatting
        run: cargo fmt --manifest-path spikes/input-macos/Cargo.toml -- --check
      - name: Run GPUI spike Clippy
        run: |
          cargo clippy --manifest-path spikes/gpui-settings/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path spikes/gpui-overlay-macos/Cargo.toml --locked --all-targets -- -D warnings
      - name: Run macOS input spike Clippy
        run: cargo clippy --manifest-path spikes/input-macos/Cargo.toml --locked --all-targets -- -D warnings
      - name: Run GPUI spike tests
        run: |
          cargo test --manifest-path spikes/gpui-settings/Cargo.toml --locked
          cargo test --manifest-path spikes/gpui-overlay-macos/Cargo.toml --locked
      - name: Run macOS input spike tests
        run: cargo test --manifest-path spikes/input-macos/Cargo.toml --locked
      - name: Check GPUI spike release builds
        run: |
          cargo check --manifest-path spikes/gpui-settings/Cargo.toml --locked --release
          cargo check --manifest-path spikes/gpui-overlay-macos/Cargo.toml --locked --release
      - name: Check macOS input spike release build
        run: cargo check --manifest-path spikes/input-macos/Cargo.toml --locked --release
      - name: Build macOS settings smoke executable
        timeout-minutes: 10
        run: cargo build --manifest-path spikes/gpui-settings/Cargo.toml --locked
      - name: Smoke macOS GPUI settings accessibility
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          executable = pathlib.Path("spikes/gpui-settings/target/debug/bongocat-gpui-settings-spike")
          completed = subprocess.run(
              [
                  str(executable),
                  "--auto-quit-ms",
                  "2500",
                  "--menu-probe",
                  "--tooltip-probe",
              ],
              capture_output=True,
              check=False,
              text=True,
              timeout=30,
          )
          output = completed.stdout + "\n" + completed.stderr
          print(output)
          if completed.returncode != 0:
              raise RuntimeError(
                  f"macOS GPUI settings smoke exited with {completed.returncode}"
              )
          for expected in (
              "accessibility tree root_role=AXGroup nodes=9 controls=7",
              "window opened",
              "first frame elapsed_ms=",
              "scale_factor=",
              "runtime snapshot revision=1",
              "accessibility action applied",
              "native menu edit actions verified",
              "native tooltip hover entered",
              "tooltip built after hover delay",
              "tooltip hover delay and exit verified",
              "runtime stopped",
              "stopped",
          ):
              if expected not in output:
                  raise RuntimeError(
                      f"macOS GPUI settings smoke did not report: {expected}"
                  )
          if output.index("gpui-settings-spike: runtime stopped") >= output.index(
              "gpui-settings-spike: stopped"
          ):
              raise RuntimeError("runtime did not stop before macOS application shutdown")
          PY
      - name: Build macOS overlay smoke executable
        timeout-minutes: 10
        run: cargo build --manifest-path spikes/gpui-overlay-macos/Cargo.toml --locked
      - name: Smoke independent AppKit and Metal overlay
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          executable = pathlib.Path("spikes/gpui-overlay-macos/target/debug/bongocat-gpui-overlay-macos-spike")

          def run_smoke(name, arguments):
              try:
                  completed = subprocess.run(
                      [str(executable), *arguments],
                      capture_output=True,
                      check=False,
                      text=True,
                      timeout=30,
                  )
              except subprocess.TimeoutExpired as error:
                  output = (error.stdout or "") + "\n" + (error.stderr or "")
                  print(output)
                  raise RuntimeError(f"{name} overlay smoke exceeded 30 seconds") from error
              output = completed.stdout + "\n" + completed.stderr
              print(output)
              if completed.returncode != 0:
                  raise RuntimeError(
                      f"{name} overlay smoke exited with {completed.returncode}"
                  )
              return output

          normal = run_smoke("normal", ["--auto-quit-ms", "1200"])
          for expected in (
              "macOS native overlay created",
              "macOS interaction mode=drag",
              "macOS overlay drag contract verified delta=24x18",
              "macOS interaction mode=click-through",
              "non-empty premultiplied-alpha draw/present submitted",
              "frame source started target_hz=60",
              "macOS overlay resized width=400 height=300",
              "overlay hidden",
              "GPUI settings window opened",
              "auto quit requested",
              "frame source stopped frames=",
              "resize_completed=true",
              "overlay window/GPU owner released",
          ):
              if expected not in normal:
                  raise RuntimeError(f"normal overlay smoke did not report: {expected}")
          frame_stop = normal.index("frame source stopped frames=")
          owner_release = normal.index("overlay window/GPU owner released")
          if owner_release <= frame_stop:
              raise RuntimeError("overlay owner released before frame source stopped")

          backing_reconcile = run_smoke(
              "backing-reconcile",
              ["--simulate-macos-stale-drawable-size", "--auto-quit-ms", "900"],
          )
          for expected in (
              "simulated stale macOS drawable size",
              "macOS drawable size reconciled from=1x1 to=",
              "non-empty premultiplied-alpha draw/present submitted",
          ):
              if expected not in backing_reconcile:
                  raise RuntimeError(
                      f"backing-reconcile overlay smoke did not report: {expected}"
                  )

          degraded = run_smoke(
              "drawable-unavailable",
              ["--simulate-macos-drawable-unavailable", "--auto-quit-ms", "900"],
          )
          for expected in (
              "overlay degraded error=simulated CAMetalLayer drawable unavailable",
              "GPUI settings window opened",
              "auto quit requested",
              "overlay window/GPU owner released",
          ):
              if expected not in degraded:
                  raise RuntimeError(
                      f"drawable-unavailable overlay smoke did not report: {expected}"
                  )

          recovered = run_smoke(
              "renderer-recovery",
              [
                  "--simulate-renderer-loss-at-frame",
                  "12",
                  "--auto-quit-ms",
                  "1600",
              ],
          )
          for expected in (
              "frame degraded kind=device_lost error=simulated renderer device loss",
              "frame renderer recovered attempt=1",
              "settings overlay status=GPUI settings + native overlay (recovered)",
              "failures=1 recoveries=1",
          ):
              if expected not in recovered:
                  raise RuntimeError(
                      f"renderer-recovery overlay smoke did not report: {expected}"
                  )
          degraded_at = recovered.index("frame degraded kind=device_lost")
          released_at = recovered.index("overlay window/GPU owner released", degraded_at)
          recovered_at = recovered.index("frame renderer recovered attempt=1")
          if not degraded_at < released_at < recovered_at:
              raise RuntimeError("macOS renderer was recreated before the failed owner released")

          cycles = run_smoke("cycles", ["--macos-overlay-cycles", "100"])
          for expected in (
              "macOS cycles=100",
              "non_empty_frames=",
              "threads_before=",
              "threads_after=",
              "threads_baseline_high_water=",
              "measurement_batches=",
              "metal_bytes_before=",
              "metal_bytes_after=",
              "clean_shutdown=true",
          ):
              if expected not in cycles:
                  raise RuntimeError(f"overlay cycle smoke did not report: {expected}")
          cycle_metrics = re.search(
              r"macOS cycles=100 non_empty_frames=(\d+).*measurement_batches=(\d+)",
              cycles,
          )
          if cycle_metrics is None:
              raise RuntimeError("overlay cycle smoke metrics were not parseable")
          non_empty_frames, measurement_batches = map(int, cycle_metrics.groups())
          if not 3 <= measurement_batches <= 6:
              raise RuntimeError("overlay cycle smoke used an invalid measurement batch count")
          if non_empty_frames != 100 * measurement_batches:
              raise RuntimeError("overlay cycle smoke frame accounting did not balance")
          PY

