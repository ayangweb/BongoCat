name: Native Rewrite Phase 0

on:
  pull_request:

permissions:
  contents: read

env:
  BONGOCAT_BUILD_ENV: development

jobs:
  fixtures:
    name: Validate shared fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned schema validator
        run: python3 -m pip install --disable-pip-version-check --requirement tools/requirements-phase0.txt
      - name: Validate fixture structure and model cases
        run: python3 tools/validate-fixtures.py
      - name: Validate Draft 2020-12 schemas
        run: python3 tools/validate-json-schema.py
      - name: Validate locale keys and placeholders
        run: python3 tools/validate-locales.py
      - name: Run deterministic input fixtures
        run: python3 tools/run-input-fixtures.py
      - name: Test Cubism SDK offline inspector
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Check legacy Cubism model baseline
        run: node tools/inspect-legacy-cubism-models.mjs --check
      - name: Check whitespace
        run: git diff --check

  dependency-policy:
    name: Check Native dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deny-0.20.2-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'deny.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-0.20.2-
      - name: Install pinned cargo-deny
        shell: bash
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fxq 'cargo-deny 0.20.2'; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
      - name: Check licenses and dependency sources
        run: ./tools/check-native-dependencies.sh

  native-workspace:
    name: Test Native workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            native/target/
          key: ${{ runner.os }}-native-workspace-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'native/rust-toolchain.toml', 'native/crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-native-workspace-
      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path native/Cargo.toml --locked --workspace
      - name: Reject implicit app build environment
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if env -u BONGOCAT_BUILD_ENV cargo check --manifest-path native/Cargo.toml --locked -p bongocat-app; then
            echo 'app build accepted a missing build environment' >&2
            exit 1
          fi
          if BONGOCAT_BUILD_ENV= cargo check --manifest-path native/Cargo.toml --locked -p bongocat-app; then
            echo 'app build accepted an empty build environment' >&2
            exit 1
          fi
          if BONGOCAT_BUILD_ENV=unknown cargo check --manifest-path native/Cargo.toml --locked -p bongocat-app; then
            echo 'app build accepted an unknown build environment' >&2
            exit 1
          fi
          if BONGOCAT_BUILD_ENV=production cargo check --manifest-path native/Cargo.toml --locked -p bongocat-app --release --features storage-test-injection; then
            echo 'Production app build accepted storage test injection' >&2
            exit 1
          fi
      - name: Check release build
        run: cargo check --manifest-path native/Cargo.toml --locked --workspace --release
      - name: Check production environment build
        shell: bash
        env:
          BONGOCAT_BUILD_ENV: production
        run: cargo check --manifest-path native/Cargo.toml --locked -p bongocat-app --release
      - name: Smoke Windows model directory picker
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 3
        env:
          RUST_BACKTRACE: full
        run: |
          cargo run --manifest-path native/Cargo.toml --locked --release -p bongocat-platform --example model_directory_picker_smoke -- --expect-cancel --auto
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          cargo run --manifest-path native/Cargo.toml --locked --release -p bongocat-platform --example model_directory_picker_smoke -- --expect-selected-any --auto
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Check Windows ARM64 platform source
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo clippy \
            --manifest-path native/Cargo.toml \
            --locked \
            -p bongocat-platform \
            --target aarch64-pc-windows-msvc \
            --all-targets \
            --all-features \
            -- \
            -D warnings
      - name: Smoke Windows D3D11 product overlay
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 12
        env:
          RUST_BACKTRACE: full
        run: |
          cargo build --manifest-path native/Cargo.toml --locked -p bongocat-app --release
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $executable = Join-Path $PWD "native/target/release/bongocat-app.exe"
          Add-Type -AssemblyName UIAutomationClient
          1..5 | ForEach-Object {
            $stdout = Join-Path $env:RUNNER_TEMP "bongocat-product-$_.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "bongocat-product-$_.stderr.log"
            $process = Start-Process `
              -FilePath $executable `
              -ArgumentList @("--run-seconds", "30", "--settings-window-smoke", "--models-page-smoke") `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            if ($_ -eq 1) {
              $windowDeadline = [DateTime]::UtcNow.AddSeconds(10)
              $processCondition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
                $process.Id
              )
              $windowNameCondition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,
                "BongoCat Settings"
              )
              $settingsWindowCondition = [System.Windows.Automation.AndCondition]::new(
                $processCondition,
                $windowNameCondition
              )
              do {
                Start-Sleep -Milliseconds 100
                $process.Refresh()
                if ($process.HasExited) {
                  throw "Windows product exited before UI Automation inspection"
                }
                $root = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst(
                  [System.Windows.Automation.TreeScope]::Children,
                  $settingsWindowCondition
                )
              } while ($null -eq $root -and [DateTime]::UtcNow -lt $windowDeadline)
              if ($null -eq $root) {
                throw "Windows product did not expose a settings HWND"
              }
              $startupCondition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,
                "Open at login"
              )
              $startupDeadline = [DateTime]::UtcNow.AddSeconds(5)
              do {
                Start-Sleep -Milliseconds 100
                $startup = $root.FindFirst(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  $startupCondition
                )
              } while ($null -eq $startup -and [DateTime]::UtcNow -lt $startupDeadline)
              if ($null -eq $startup) {
                throw "Windows UIA did not expose the startup switch"
              }
              if ($startup.Current.ControlType -ne [System.Windows.Automation.ControlType]::Button) {
                throw "Windows UIA startup switch did not use the button control type"
              }
              # Some GitHub-hosted runner UIAutomationClient builds do not
              # expose the optional ARIA role property at all. Resolve the
              # stable UIA property id directly when the client supports it.
              $ariaRoleProperty = $null
              try {
                $ariaRoleProperty = [System.Windows.Automation.AutomationProperty]::LookupById(30101)
              } catch {
                $ariaRoleProperty = $null
              }
              if ($null -eq $ariaRoleProperty) {
                Write-Warning "Windows UIA client does not expose optional UIA_AriaRoleProperty (30101); relying on ControlType and TogglePattern checks"
              } else {
                $ariaRole = [string]$startup.GetCurrentPropertyValue($ariaRoleProperty)
                if ($ariaRole -ne "switch") {
                  throw "Windows UIA startup control did not expose aria role switch: '$ariaRole'"
                }
              }
              if (-not $startup.Current.IsEnabled -or -not $startup.Current.IsKeyboardFocusable) {
                throw "Windows UIA startup switch was not enabled and focusable"
              }
              $toggle = $startup.GetCurrentPattern(
                [System.Windows.Automation.TogglePattern]::Pattern
              )
              $toggleState = $toggle.Current.ToggleState
              if ($toggleState -notin @(
                [System.Windows.Automation.ToggleState]::On,
                [System.Windows.Automation.ToggleState]::Off
              )) {
                throw "Windows UIA startup switch exposed an indeterminate value"
              }
              $initialToggleState = $toggleState
              # Exercise the real UIA action and wait for the revisioned settings
              # snapshot to project the new state. The runner uses an ephemeral
              # HKCU profile, so toggling twice restores the initial disabled/
              # enabled state without changing a user's login item.
              if ($toggleState -eq [System.Windows.Automation.ToggleState]::Off) {
                $expectedToggleState = [System.Windows.Automation.ToggleState]::On
              } else {
                $expectedToggleState = [System.Windows.Automation.ToggleState]::Off
              }
              $actionSucceeded = $false
              $actionError = "startup switch was unavailable"
              $actionDeadline = [DateTime]::UtcNow.AddSeconds(2)
              do {
                $startup = $root.FindFirst(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  $startupCondition
                )
                if ($null -ne $startup) {
                  try {
                    $startup.GetCurrentPattern(
                      [System.Windows.Automation.TogglePattern]::Pattern
                    ).Toggle()
                    $actionSucceeded = $true
                  } catch {
                    $actionError = $_.Exception.Message
                  }
                }
                if (-not $actionSucceeded) {
                  Start-Sleep -Milliseconds 50
                }
              } while (-not $actionSucceeded -and [DateTime]::UtcNow -lt $actionDeadline)
              if (-not $actionSucceeded) {
                throw "Windows UIA startup switch action failed after reacquiring the current node: $actionError"
              }
              $toggleDeadline = [DateTime]::UtcNow.AddSeconds(5)
              do {
                Start-Sleep -Milliseconds 100
                $startup = $root.FindFirst(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  $startupCondition
                )
                if ($null -ne $startup) {
                  try {
                    $toggleState = $startup.GetCurrentPattern(
                      [System.Windows.Automation.TogglePattern]::Pattern
                    ).Current.ToggleState
                  } catch {
                    $toggleState = $null
                  }
                }
              } while ($toggleState -ne $expectedToggleState -and [DateTime]::UtcNow -lt $toggleDeadline)
              if ($toggleState -ne $expectedToggleState) {
                throw "Windows UIA startup switch action did not update state: expected '$expectedToggleState', found '$toggleState'"
              }
              $actionSucceeded = $false
              $actionError = "startup switch was unavailable"
              $actionDeadline = [DateTime]::UtcNow.AddSeconds(2)
              do {
                $startup = $root.FindFirst(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  $startupCondition
                )
                if ($null -ne $startup) {
                  try {
                    $startup.GetCurrentPattern(
                      [System.Windows.Automation.TogglePattern]::Pattern
                    ).Toggle()
                    $actionSucceeded = $true
                  } catch {
                    $actionError = $_.Exception.Message
                  }
                }
                if (-not $actionSucceeded) {
                  Start-Sleep -Milliseconds 50
                }
              } while (-not $actionSucceeded -and [DateTime]::UtcNow -lt $actionDeadline)
              if (-not $actionSucceeded) {
                throw "Windows UIA startup switch restore action failed after reacquiring the current node: $actionError"
              }
              $restoreDeadline = [DateTime]::UtcNow.AddSeconds(5)
              do {
                Start-Sleep -Milliseconds 100
                $startup = $root.FindFirst(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  $startupCondition
                )
                if ($null -ne $startup) {
                  try {
                    $toggleState = $startup.GetCurrentPattern(
                      [System.Windows.Automation.TogglePattern]::Pattern
                    ).Current.ToggleState
                  } catch {
                    $toggleState = $null
                  }
                }
              } while ($toggleState -ne $initialToggleState -and [DateTime]::UtcNow -lt $restoreDeadline)
              if ($toggleState -ne $initialToggleState) {
                throw "Windows UIA startup switch action did not restore state: expected '$initialToggleState', found '$toggleState'"
              }
              # The settings snapshot revision rebuilds the GPUI control tree;
              # reacquire the element before exercising focus on the new node.
              $startup = $root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $startupCondition
              )
              if ($null -eq $startup) {
                throw "Windows UIA startup switch disappeared after state update"
              }
              $startup.SetFocus()
              $focusDeadline = [DateTime]::UtcNow.AddSeconds(2)
              do {
                Start-Sleep -Milliseconds 50
                $focused = [System.Windows.Automation.AutomationElement]::FocusedElement
                $focusedName = if ($null -eq $focused) { "" } else { $focused.Current.Name }
              } while ($focusedName -ne "Open at login" -and [DateTime]::UtcNow -lt $focusDeadline)
              if ($focusedName -ne "Open at login") {
                throw "Windows UIA startup switch rejected focus action"
              }
              Write-Host "bongocat-app: Windows UIA startup switch role/value/action verified"
            }
            if (!$process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Windows product lifecycle smoke $_ exceeded 60 seconds"
            }
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) {
              exit $process.ExitCode
            }
          }
      - name: Smoke macOS settings window lifecycle
        if: matrix.os == 'macos-latest'
        run: cargo run --manifest-path native/Cargo.toml --locked -p bongocat-app --release -- --run-seconds 4 --settings-window-smoke --models-page-smoke
      - name: Smoke macOS configuration recovery window
        if: matrix.os == 'macos-latest'
        run: |
          output=$(cargo run --manifest-path native/Cargo.toml --locked -p bongocat-app --release --features storage-test-injection --target-dir native/target/storage-test-injection -- --configuration-recovery-smoke 2>&1)
          printf '%s\n' "$output"
          grep -Fq 'bongocat-app: configuration recovery required' <<<"$output"
          grep -Fq 'bongocat-app: recovery window opened' <<<"$output"
          grep -Fq 'bongocat-app: recovery diagnostics verified' <<<"$output"
          grep -Fq 'bongocat-app: recovery service stopped' <<<"$output"
      - name: Smoke macOS settings window state restore
        if: matrix.os == 'macos-latest'
        run: |
          output=$(cargo run --manifest-path native/Cargo.toml --locked -p bongocat-app --release --features storage-test-injection --target-dir native/target/storage-test-injection -- --settings-window-state-smoke 2>&1)
          printf '%s\n' "$output"
          grep -Fq 'bongocat-app: settings window state restored after restart' <<<"$output"
      - name: Smoke Windows configuration recovery window
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $smokeTarget = Join-Path $PWD "native/target/storage-test-injection"
          cargo build --manifest-path native/Cargo.toml --locked -p bongocat-app --release --features storage-test-injection --target-dir $smokeTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = Join-Path $smokeTarget "release/bongocat-app.exe"
          if (-not (Test-Path $executable)) {
            throw "storage injection smoke executable was not built"
          }
          $stdout = Join-Path $env:RUNNER_TEMP "bongocat-recovery-window.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "bongocat-recovery-window.stderr.log"
          Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath $executable `
            -ArgumentList @("--configuration-recovery-smoke") `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          Add-Type -AssemblyName UIAutomationClient
          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          $processCondition = [System.Windows.Automation.PropertyCondition]::new(
            [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
            $process.Id
          )
          $windowNameCondition = [System.Windows.Automation.PropertyCondition]::new(
            [System.Windows.Automation.AutomationElement]::NameProperty,
            "BongoCat Settings"
          )
          $condition = [System.Windows.Automation.AndCondition]::new(
            $processCondition,
            $windowNameCondition
          )
          $root = $null
          do {
            Start-Sleep -Milliseconds 100
            $process.Refresh()
            if ($process.HasExited) { break }
            $root = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst(
              [System.Windows.Automation.TreeScope]::Children,
              $condition
            )
          } while ($null -eq $root -and [DateTime]::UtcNow -lt $deadline)
          if ($null -eq $root) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "Windows recovery settings window did not open"
          }
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Windows recovery settings smoke exceeded 15 seconds"
          }
          $output = @(
            Get-Content $stdout -Raw -ErrorAction SilentlyContinue
            Get-Content $stderr -Raw -ErrorAction SilentlyContinue
          ) -join "`n"
          Write-Host $output
          if ($process.ExitCode -ne 0) { throw "Windows recovery settings smoke exited with $($process.ExitCode)" }
          foreach ($expected in @(
            "bongocat-app: configuration recovery required",
            "bongocat-app: recovery window opened",
            "bongocat-app: recovery diagnostics verified",
            "bongocat-app: recovery service stopped"
          )) {
            if (-not $output.Contains($expected)) { throw "Windows recovery smoke did not report: $expected" }
          }
          $stateStdout = Join-Path $env:RUNNER_TEMP "bongocat-settings-window-state.stdout.log"
          $stateStderr = Join-Path $env:RUNNER_TEMP "bongocat-settings-window-state.stderr.log"
          Remove-Item $stateStdout, $stateStderr -Force -ErrorAction SilentlyContinue
          $stateProcess = Start-Process `
            -FilePath $executable `
            -ArgumentList @("--settings-window-state-smoke") `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $stateStdout `
            -RedirectStandardError $stateStderr
          if (-not $stateProcess.WaitForExit(20000)) {
            Stop-Process -Id $stateProcess.Id -Force -ErrorAction SilentlyContinue
            throw "Windows settings window state smoke exceeded 20 seconds"
          }
          $stateOutput = @(
            Get-Content $stateStdout -Raw -ErrorAction SilentlyContinue
            Get-Content $stateStderr -Raw -ErrorAction SilentlyContinue
          ) -join "`n"
          Write-Host $stateOutput
          if ($stateProcess.ExitCode -ne 0) { throw "Windows settings window state smoke exited with $($stateProcess.ExitCode)" }
          if (-not $stateOutput.Contains("bongocat-app: settings window state restored after restart")) {
            throw "Windows settings window state smoke did not report restart restore"
          }
      - name: Smoke Windows startup item lifecycle
        if: matrix.os == 'windows-latest'
        run: cargo test --manifest-path native/Cargo.toml --locked --release -p bongocat-platform windows_startup_item_registry_smoke_restores_original_value -- --ignored
      - name: Reject implicit macOS package environment
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if env -u BONGOCAT_BUILD_ENV ./native/scripts/package-macos.sh; then
            echo 'package script accepted a missing build environment' >&2
            exit 1
          fi
          if BONGOCAT_BUILD_ENV= ./native/scripts/package-macos.sh; then
            echo 'package script accepted an empty build environment' >&2
            exit 1
          fi
          if BONGOCAT_BUILD_ENV=unknown ./native/scripts/package-macos.sh; then
            echo 'package script accepted an unknown build environment' >&2
            exit 1
          fi
      - name: Smoke macOS startup item lifecycle
        if: matrix.os == 'macos-latest'
        run: |
          app_path=$(BONGOCAT_BUILD_ENV=production ./native/scripts/package-macos.sh)
          install_root=$(mktemp -d '/Applications/bongocat-startup-item-smoke.XXXXXX')
          installed_app="$install_root/BongoCat.app"
          stdout_path="$RUNNER_TEMP/macos-startup-item.stdout.log"
          stderr_path="$RUNNER_TEMP/macos-startup-item.stderr.log"
          cleanup() {
            /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister \
              -u "$installed_app" >/dev/null 2>&1 || true
            rm -rf "$install_root"
          }
          trap cleanup EXIT
          ditto "$app_path" "$installed_app"
          codesign --verify --deep --strict "$installed_app"
          rm -f "$stdout_path" "$stderr_path"
          open \
            -n \
            -o "$stdout_path" \
            --stderr "$stderr_path" \
            "$installed_app" \
            --args \
            --startup-item-smoke
          restored=false
          for _ in {1..120}; do
            if grep -Fq 'bongocat-app: startup-item restored state' "$stdout_path"; then
              restored=true
              break
            fi
            if grep -Fq 'Error:' "$stderr_path"; then
              break
            fi
            sleep 0.5
          done
          cat "$stdout_path" "$stderr_path" 2>/dev/null || true
          grep -Fq 'bongocat-app: startup-item original state' "$stdout_path"
          test "$restored" = true
      - name: Smoke macOS application reopen lifecycle
        if: matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: |
          app_path=$(./native/scripts/package-macos.sh)
          stdout_path="$RUNNER_TEMP/macos-application-reopen.stdout.log"
          stderr_path="$RUNNER_TEMP/macos-application-reopen.stderr.log"
          rm -f "$stdout_path" "$stderr_path"
          open \
            -n \
            -W \
            -o "$stdout_path" \
            --stderr "$stderr_path" \
            "$app_path" \
            --args \
            --run-seconds 10 \
            --application-reopen-smoke &
          open_waiter=$!

          ready=0
          for _ in $(seq 1 150); do
            if grep -Fq 'bongocat-app: application-reopen primary ready' "$stdout_path" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$open_waiter" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$stdout_path" "$stderr_path" 2>/dev/null || true
            pkill -f -- "$app_path/Contents/MacOS/bongocat-app" || true
            wait "$open_waiter" || true
            printf '%s\n' 'macOS product did not reach the application-reopen gate' >&2
            exit 1
          fi

          open "$app_path"
          sleep 0.5
          pid_path="$RUNNER_TEMP/macos-application-reopen.pids"
          pgrep -f "$app_path/Contents/MacOS/bongocat-app" > "$pid_path" || true
          process_count=$(wc -l < "$pid_path" | tr -d ' ')
          if [ "$process_count" -ne 1 ]; then
            pkill -f -- "$app_path/Contents/MacOS/bongocat-app" || true
            wait "$open_waiter" || true
            printf 'LaunchServices observed %s BongoCat processes after reopen\n' "$process_count" >&2
            exit 1
          fi

          wait "$open_waiter"
          cat "$stdout_path" "$stderr_path" 2>/dev/null || true
          grep -Fq \
            'bongocat-app: application reopen restored the settings window' \
            "$stdout_path"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app_path/Contents/Info.plist")" = \
            'com.ayangweb.bongo-cat'
          codesign --verify --deep --strict "$app_path"
      - name: Smoke native system menu lifecycle
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        timeout-minutes: 2
        run: cargo run --manifest-path native/Cargo.toml --locked -p bongocat-app --release -- --run-seconds 10 --system-menu-smoke
      - name: Smoke Windows single-instance wake
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $executable = Join-Path $PWD "native/target/release/bongocat-app.exe"
          $primaryStdout = Join-Path $env:RUNNER_TEMP "single-instance-primary.stdout.log"
          $primaryStderr = Join-Path $env:RUNNER_TEMP "single-instance-primary.stderr.log"
          $secondaryStdout = Join-Path $env:RUNNER_TEMP "single-instance-secondary.stdout.log"
          $secondaryStderr = Join-Path $env:RUNNER_TEMP "single-instance-secondary.stderr.log"
          Remove-Item `
            $primaryStdout, $primaryStderr, $secondaryStdout, $secondaryStderr `
            -Force `
            -ErrorAction SilentlyContinue

          $primary = Start-Process `
            -FilePath $executable `
            -ArgumentList @("--run-seconds", "10", "--single-instance-smoke") `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $primaryStdout `
            -RedirectStandardError $primaryStderr
          $readyDeadline = [DateTime]::UtcNow.AddSeconds(15)
          do {
            Start-Sleep -Milliseconds 100
            $primaryOutput = @(
              Get-Content $primaryStdout -Raw -ErrorAction SilentlyContinue
              Get-Content $primaryStderr -Raw -ErrorAction SilentlyContinue
            ) -join "`n"
            $primary.Refresh()
          } while (
            -not $primaryOutput.Contains("bongocat-app: single-instance primary ready") -and
            -not $primary.HasExited -and
            [DateTime]::UtcNow -lt $readyDeadline
          )
          if (-not $primaryOutput.Contains("bongocat-app: single-instance primary ready")) {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            $primary.WaitForExit()
            Write-Host $primaryOutput
            throw "primary instance did not reach the hidden-window wake gate"
          }

          $secondary = Start-Process `
            -FilePath $executable `
            -ArgumentList @("--run-seconds", "1", "--single-instance-smoke") `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput $secondaryStdout `
            -RedirectStandardError $secondaryStderr
          if (-not $secondary.WaitForExit(10000)) {
            Stop-Process -Id $secondary.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            throw "secondary instance did not exit after notifying the primary"
          }
          $secondaryOutput = @(
            Get-Content $secondaryStdout -Raw -ErrorAction SilentlyContinue
            Get-Content $secondaryStderr -Raw -ErrorAction SilentlyContinue
          ) -join "`n"
          Write-Host $secondaryOutput
          if ($secondary.ExitCode -ne 0) {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            throw "secondary instance exited with $($secondary.ExitCode)"
          }
          if (-not $secondaryOutput.Contains("bongocat-app: secondary instance notified primary")) {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            throw "secondary instance did not report a successful primary notification"
          }

          if (-not $primary.WaitForExit(30000)) {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
            $primary.WaitForExit()
            throw "primary instance did not finish ordered shutdown after the wake"
          }
          $primaryOutput = @(
            Get-Content $primaryStdout -Raw -ErrorAction SilentlyContinue
            Get-Content $primaryStderr -Raw -ErrorAction SilentlyContinue
          ) -join "`n"
          Write-Host $primaryOutput
          if ($primary.ExitCode -ne 0) {
            throw "primary instance exited with $($primary.ExitCode)"
          }
          if (-not $primaryOutput.Contains("bongocat-app: single-instance wake restored the settings window")) {
            throw "primary instance did not restore the existing settings window after the wake"
          }
      - name: Smoke formal Windows missing-release recovery
        if: matrix.os == 'windows-latest'
        run: cargo test --manifest-path native/Cargo.toml --locked -p bongocat-platform --lib --release windows::tests::synthetic_missing_release_is_reconciled_in_formal_runtime -- --ignored --exact
      - name: Smoke transactional Windows D3D11 model switching
        if: matrix.os == 'windows-latest'
        run: cargo run --manifest-path native/Cargo.toml --locked -p bongocat-overlay --release -- standard 0 --switch-cycles 3

  cubism-binding-contract:
    name: Check Cubism binding generation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Hash Rust toolchain
        id: rust-toolchain
        shell: python
        run: |
          import hashlib
          import os
          import subprocess

          version = subprocess.check_output(["rustc", "-Vv"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"hash={hashlib.sha256(version).hexdigest()}\n")
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            tools/cubism-bindgen/target/
          key: ${{ runner.os }}-cubism-bindgen-${{ steps.rust-toolchain.outputs.hash }}-${{ hashFiles('tools/cubism-bindgen/Cargo.lock', 'tools/cubism-bindgen/Cargo.toml', 'tools/cubism-core-probe/Cargo.lock', 'tools/cubism-core-probe/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cubism-bindgen-${{ steps.rust-toolchain.outputs.hash }}-
            ${{ runner.os }}-cubism-bindgen-
      - name: Check formatting
        run: cargo fmt --manifest-path tools/cubism-bindgen/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/cubism-bindgen/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path tools/cubism-bindgen/Cargo.toml --locked
      - name: Check deterministic synthetic bindings
        run: cargo run --manifest-path tools/cubism-bindgen/Cargo.toml --locked -- check-fixtures
      - name: Compile Core probe against synthetic bindings
        env:
          BONGOCAT_CUBISM_BINDINGS: ${{ github.workspace }}/tools/cubism-bindgen/fixtures/expected/x86_64-pc-windows-msvc.rs
        run: |
          cargo fmt --manifest-path tools/cubism-core-probe/Cargo.toml -- --check
          cargo clippy --manifest-path tools/cubism-core-probe/Cargo.toml --locked --all-targets --target-dir tools/cubism-bindgen/target/core-probe -- -D warnings
          cargo check --manifest-path tools/cubism-core-probe/Cargo.toml --locked --release --target-dir tools/cubism-bindgen/target/core-probe
      - name: Compile synthetic bindings for every Core target
        shell: bash
        run: |
          rustup target add \
            x86_64-pc-windows-msvc \
            aarch64-apple-darwin \
            x86_64-apple-darwin
          output_directory=$(mktemp -d)
          for target in \
            x86_64-pc-windows-msvc \
            aarch64-apple-darwin \
            x86_64-apple-darwin; do
            mkdir -p "$output_directory/$target"
            rustc \
              --crate-name cubism_core_synthetic \
              --crate-type lib \
              --edition 2024 \
              --target "$target" \
              --emit metadata \
              -D warnings \
              -A non_camel_case_types \
              -A non_snake_case \
              -A non_upper_case_globals \
              "tools/cubism-bindgen/fixtures/expected/$target.rs" \
              --out-dir "$output_directory/$target"
          done
      - name: Check release build
        run: cargo check --manifest-path tools/cubism-bindgen/Cargo.toml --locked --release

