version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /tools/cubism-bindgen
      - /tools/cubism-core-probe
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - '*'
