[package]
name = "bongocat-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-channel.workspace = true
bongocat-config.workspace = true
bongocat-runtime.workspace = true
# `HasWindowHandle` is the parameter type of the public `apply_theme` on every platform,
# including the one where the theme itself is a no-op, so the trait has to resolve
# everywhere. `raw-window-handle` is a cross-platform handle abstraction (Wayland, X11,
# Win32 and AppKit all implement it), not a platform-specific binding.
raw-window-handle.workspace = true
url.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey.workspace = true
image.workspace = true
muda.workspace = true
tray-icon.workspace = true

accesskit.workspace = true
arboard.workspace = true
rfd.workspace = true
opener.workspace = true
sys-locale = "=0.3.2"
auto-launch = "=0.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos.workspace = true
async-io.workspace = true
block2 = "=0.6.2"
# `run_on_main` hands the startup permission prompt to the main thread, where AppKit
# windows must be built and the theme-following `NSAlert` has to run (ADR-0032, 2026-09-18).
dispatch2 = "=0.3.1"
objc2 = "=0.6.4"
# `NSAlert` carries the theme-following startup permission prompt (ADR-0048, ADR-0032).
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAlert", "NSAppearance", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSView", "NSWindow", "block2", "objc2-core-foundation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDate", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSGeometry", "NSNotification", "NSObject", "NSString", "NSURL", "block2"] }
objc2-game-controller = { version = "=0.3.2", default-features = false, features = ["GCController", "GCControllerAxisInput", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerElement", "GCExtendedGamepad", "GCPhysicalInputProfile", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows.workspace = true
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    # `DwmSetWindowAttribute` + `DWMWA_USE_IMMERSIVE_DARK_MODE` is the only documented
    # way to make a window frame follow an application theme (ADR-0048).
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    # `UISettings.GetColorValue(Foreground)` is how gpui's Windows backend itself reads
    # the system appearance before pinning a window frame (ADR-0048); the theme module
    # must derive "follow the system" from the same source so the two writers agree.
    "UI_ViewManagement",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[lints.clippy]
dbg_macro = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
