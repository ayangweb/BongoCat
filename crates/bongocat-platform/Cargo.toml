[package]
name = "bongocat-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bongocat-config.workspace = true
bongocat-input.workspace = true
raw-window-handle.workspace = true
url.workspace = true
thiserror.workspace = true

image.workspace = true

rfd.workspace = true
opener.workspace = true
sys-locale = "=0.3.2"
auto-launch = "=0.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
gilrs = { workspace = true }
async-io.workspace = true
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAlert", "NSAppearance", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSPanel", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSView", "NSWindow", "block2", "objc2-core-foundation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDate", "CFMachPort", "CFRunLoop"] }
libc.workspace = true
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSGeometry", "NSNotification", "NSObject", "NSString", "NSURL", "NSUserDefaults", "block2"] }
permission-flow.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gilrs = { workspace = true, features = ["wgi"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "UI_ViewManagement",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
bongocat-runtime.workspace = true
global-hotkey.workspace = true
tempfile.workspace = true

[lints.clippy]
dbg_macro = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[target.'cfg(not(target_os = "linux"))'.dependencies]
global-hotkey.workspace = true
arboard.workspace = true
muda.workspace = true
tray-icon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
async-io.workspace = true
futures-util.workspace = true
bongocat-input-helper = { path = "../bongocat-input-helper" }
rfd = { workspace = true, features = ["xdg-portal", "wayland"] }
gilrs.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies.ksni]
version = "=0.3.6"
default-features = false
features = ["async-io", "blocking"]
