[package]
name = "bongocat-packaging"
description = "Project-level build, bundle and installer packaging entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cargo-packager.workspace = true
flate2.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
# The host's own manifest parser, so one case can ask the only question that decides
# whether a shipped plugin exists: can the host read this file? Every other check over
# `plugin.json` reads it as JSON, and as JSON the file is perfect even when the host
# refuses it — which is how a copy table the host had never heard of made all three
# shipped plugins un-installable with no failing test.
bongocat-plugin.workspace = true
bongocat-plugin-protocol.workspace = true
cargo-packager-updater.workspace = true

[lints]
workspace = true
