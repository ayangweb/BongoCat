[package]
name = "bongocat-plugin"
description = "The plugin host: running plugin processes, and what they show on the model window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bongocat-audio.workspace = true
bongocat-config.workspace = true
bongocat-log.workspace = true
bongocat-model.workspace = true
bongocat-plugin-protocol.workspace = true
bongocat-plugin-render.workspace = true
bongocat-render.workspace = true
bongocat-runtime.workspace = true
bongocat-storage.workspace = true
bongocat-update.workspace = true
minisign-verify = "=0.2.5"
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.11.0"
thiserror.workspace = true
time.workspace = true
ureq = "=2.12.1"
zip.workspace = true

# `harness = false` because this file's plugin half writes the protocol to stdout from
# inside a child process of the very test that starts it — and `libtest` captures a
# running test's output and prints it when the test ends, so a `#[test]` would have had
# every message swallowed. A plain `main` is what a plugin is.
[[test]]
name = "process_session"
harness = false

[dev-dependencies]
# The SDK, so one case in this file can be a plugin written the way a plugin author
# writes one rather than a hand-rolled imitation of the protocol. Without it the SDK's own
# half of the boundary is untested from the outside, which is how a writer pointed at the
# wrong stream survived a file whose whole subject is that the two sides talk.
bongocat-plugin-sdk.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
