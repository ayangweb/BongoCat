[workspace]
resolver = "3"
members = [
    "crates/bongocat-app",
    "crates/bongocat-audio",
    "crates/bongocat-i18n",
    "crates/bongocat-input",
    "crates/bongocat-ui-protocol",
    "crates/bongocat-live2d-playback",
    "crates/bongocat-live2d-render",
    "crates/bongocat-model-store",
    "crates/bongocat-config",
    "crates/bongocat-live2d",
    "crates/bongocat-log",
    "crates/bongocat-model",
    "crates/bongocat-overlay",
    "crates/bongocat-packaging",
    "crates/bongocat-platform",
    "crates/bongocat-plugin-manager",
    "crates/bongocat-plugin-hud",
    "crates/bongocat-plugin-packaging",
    "crates/bongocat-plugin-sdk",
    "crates/bongocat-plugin-service",
    "crates/bongocat-render",
    "crates/bongocat-runtime",
    "crates/bongocat-storage",
    "crates/bongocat-ui",
    "crates/bongocat-update",
    "plugins/input-source",
    "plugins/key-sounds",
    "plugins/pomodoro",
]

[workspace.package]
version = "2.4.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/ayangweb/BongoCat"
publish = false

[workspace.dependencies]
arboard = { version = "=3.7.0", default-features = false }
async-io = "=2.6.0"
atomic-write-file = "=0.3.1"
async-channel = "=2.5.0"
base64 = "=0.23.1"
cargo-packager = { version = "=0.11.8", default-features = false, features = ["rustls-tls"] }
cargo-packager-updater = { version = "=0.2.3", default-features = false, features = ["rustls-tls"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
dirs = "=7.0.0"
embed-resource = "=3.0.12"
flate2 = "=1.1.10"
global-hotkey = "=0.9.0"
gpui-kit = { version = "=0.8.1", features = ["gpui-fast"] }
gpui-pre-reqwest-client = { version = "=0.3.10", default-features = false }
gilrs = { git = "https://github.com/ayangweb/gilrs", rev = "c7e97f54e9e4b10ff89d3527560a22f6817329ea", default-features = false }
rust-i18n = "=4.2.4"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
libc = "=0.2.191"
minisign = "=0.10.0"
muda = { version = "=0.21.2", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSImage", "NSImageRep", "NSGraphicsContext", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDictionary", "CFNotificationCenter", "CFRunLoop", "CFString", "CFURL"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSURL", "NSString"] }
opener = { version = "=0.9.0", features = ["reveal"] }
oxipng = { version = "=10.2.1", default-features = false }
permission-flow = { git = "https://github.com/ayangweb/permission-flow", rev = "fad0354d960cf775ac332e6375916f7cc6424c7b" }
plist = "=1.10.3"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
raw-window-handle = "=0.6.2"
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "flac"] }
schemars = { version = "=1.2.3", features = ["derive"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = { version = "=0.3.55", default-features = false, features = ["formatting", "macros", "parsing"] }
tray-icon = { version = "=0.26.1", default-features = false }
url = "=2.5.8"
walkdir = "=2.5.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "=9.1.2", default-features = false, features = ["deflate-flate2"] }

bongocat-config = { path = "crates/bongocat-config" }
bongocat-input = { path = "crates/bongocat-input" }
bongocat-ui-protocol = { path = "crates/bongocat-ui-protocol" }
bongocat-live2d-playback = { path = "crates/bongocat-live2d-playback" }
bongocat-live2d-render = { path = "crates/bongocat-live2d-render" }
bongocat-model-store = { path = "crates/bongocat-model-store" }
bongocat-audio = { path = "crates/bongocat-audio" }
bongocat-i18n = { path = "crates/bongocat-i18n" }
bongocat-live2d = { path = "crates/bongocat-live2d" }
bongocat-log = { path = "crates/bongocat-log" }
bongocat-model = { path = "crates/bongocat-model" }
bongocat-overlay = { path = "crates/bongocat-overlay" }
bongocat-platform = { path = "crates/bongocat-platform" }
bongocat-plugin-sdk = { path = "crates/bongocat-plugin-sdk" }
bongocat-plugin-manager = { path = "crates/bongocat-plugin-manager" }
bongocat-plugin-hud = { path = "crates/bongocat-plugin-hud" }
bongocat-plugin-packaging = { path = "crates/bongocat-plugin-packaging" }
bongocat-plugin-service = { path = "crates/bongocat-plugin-service" }
bongocat-render = { path = "crates/bongocat-render" }
bongocat-runtime = { path = "crates/bongocat-runtime" }
bongocat-storage = { path = "crates/bongocat-storage" }
bongocat-ui = { path = "crates/bongocat-ui" }
bongocat-update = { path = "crates/bongocat-update" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

[profile.dev]
debug = true
incremental = true
panic = "unwind"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

[profile.profiling]
inherits = "release"
strip = "none"
debug = "full"
lto = false
