[workspace]
resolver = "3"
members = [
    "crates/bongocat-app",
    "crates/bongocat-audio",
    "crates/bongocat-i18n",
    "crates/bongocat-config",
    "crates/bongocat-live2d",
    "crates/bongocat-log",
    "crates/bongocat-model",
    "crates/bongocat-overlay",
    "crates/bongocat-packaging",
    "crates/bongocat-platform",
    "crates/bongocat-render",
    "crates/bongocat-runtime",
    "crates/bongocat-storage",
    "crates/bongocat-ui",
    "crates/bongocat-update",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/ayangweb/BongoCat"
publish = false

[workspace.dependencies]
arboard = { version = "=3.6.1", default-features = false }
async-io = "=2.6.0"
atomic-write-file = "=0.3.1"
async-channel = "=2.5.0"
cargo-packager = { version = "=0.11.8", default-features = false, features = ["rustls-tls"] }
cargo-packager-updater = { version = "=0.2.3", default-features = false, features = ["rustls-tls"] }
dirs = "=6.0.0"
embed-resource = "=3.0.11"
flate2 = "=1.1.10"
# OS-registered global shortcuts (ADR-0044): `RegisterHotKey` on Windows and
# `RegisterEventHotKey` on macOS behind one crate. Only the manager/event
# surface is used; chord parsing and target dispatch stay in bongocat-config
# and bongocat-platform.
global-hotkey = "=0.8.0"
gpui-kit = "=0.6.6"
rust-i18n = "=4.2.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
muda = { version = "=0.20.0", default-features = false }
opener = { version = "=0.8.5", features = ["reveal"] }
# Lossless PNG re-encoder for key images the model converter composes. Only the
# library entry point is used: the CLI (`binary`), the Zopfli backend and the
# rayon-backed filter search are all off, because the library default already
# recodes IDAT with libdeflate and that measured ~43% smaller output on real
# key images in ~0.05s each, while Zopfli bought another 5% for 15x the time.
oxipng = { version = "=10.2.1", default-features = false }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# CommonMark parsing for the update window's release notes. `default-features = false`
# drops the CLI argument parser and the HTML renderer: the notes are rendered as GPUI
# elements, never as markup, so neither is used.
pulldown-cmark = { version = "=0.13.4", default-features = false }
raw-window-handle = "=0.6.2"
# `common-controls-v6` switches the Windows message dialog to `TaskDialogIndirect`, which is the
# only way `OkCancelCustom` labels reach the native prompt. It needs the ComCtl32 v6 activation
# context; the executable already carries an application manifest with that dependency because
# `gpui-pre` embeds one in its static library, so only the feature was missing (ADR-0032).
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "flac"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tar = "=0.4.46"
tempfile = "=3.27.0"
tray-icon = { version = "=0.25.0", default-features = false }
url = "=2.5.8"
zip = { version = "=8.6.0", default-features = false }

bongocat-config = { path = "crates/bongocat-config" }
bongocat-audio = { path = "crates/bongocat-audio" }
bongocat-i18n = { path = "crates/bongocat-i18n" }
bongocat-live2d = { path = "crates/bongocat-live2d" }
bongocat-log = { path = "crates/bongocat-log" }
bongocat-model = { path = "crates/bongocat-model" }
bongocat-overlay = { path = "crates/bongocat-overlay" }
bongocat-platform = { path = "crates/bongocat-platform" }
bongocat-render = { path = "crates/bongocat-render" }
bongocat-runtime = { path = "crates/bongocat-runtime" }
bongocat-storage = { path = "crates/bongocat-storage" }
bongocat-ui = { path = "crates/bongocat-ui" }
bongocat-update = { path = "crates/bongocat-update" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

[profile.dev]
debug = true
incremental = true
panic = "unwind"

[profile.release]
strip = "symbols"
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "thin"

[profile.profiling]
inherits = "release"
strip = "none"
debug = "full"
lto = false
