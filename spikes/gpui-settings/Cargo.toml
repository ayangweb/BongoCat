[package]
name = "bongocat-gpui-settings-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Keep this probe independent from the legacy root Tauri workspace.
[workspace]

[dependencies]
# Runtime shader compilation keeps this probe runnable on development machines
# without the optional Xcode Metal Toolchain component. Release packaging must
# validate GPUI's default precompiled-shader path separately.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

[profile.release]
opt-level = 2
lto = "thin"
