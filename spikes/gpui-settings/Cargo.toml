[package]
name = "bongocat-gpui-settings-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui = "=0.2.2"
accesskit = "=0.25.0"
async-channel = "=2.5.0"
raw-window-handle = "=0.6.2"
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "=0.27.0"
objc2 = "=0.5.2"
objc2-foundation = "=0.2.2"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "=0.35.0"

[dev-dependencies]
futures-lite = "=2.6.1"

[profile.release]
opt-level = 2
lto = "thin"
