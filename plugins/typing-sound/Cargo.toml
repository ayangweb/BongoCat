[package]
name = "bongocat-plugin-typing-sound"
version = "1.0.0"
edition = "2021"
rust-version = "1.97"

[lib]
crate-type = ["cdylib"]

[dependencies]
bongocat-plugin-sdk = { path = "../../crates/bongocat-plugin-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
