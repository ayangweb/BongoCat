[package]
name = "bongocat-plugin-agent-watch"
description = "Watches what an AI coding tool is doing from its hook events, and has the BongoCat model react."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "agent-watch"
path = "src/main.rs"

[dependencies]
# One dependency a plugin may have, plus one for JSON. The second is here because this plugin
# reads two documents it did not write and cannot type: a hook payload from another program,
# and the user's own mapping. Both are arbitrary JSON with a shape that changes when somebody
# else decides it should, which is exactly what `serde` is for and exactly what the SDK's
# typed accessors are not — they exist so a plugin cannot invent a config shape the host
# will not render, and neither of these two is rendered by the host.
bongocat-plugin-sdk.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
