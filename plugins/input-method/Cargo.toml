[package]
name = "bongocat-plugin-input-method"
description = "Shows which keyboard input method is selected, on the BongoCat model window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "input-method"
path = "src/main.rs"

[dependencies]
# One dependency, and the only one a plugin may have. This plugin reads one fact the host
# publishes and draws one line: there is no input code here, no state to keep, no file of
# its own, and no calendar — the shape a plugin takes when its whole job is to show
# something the system already knows.
bongocat-plugin-sdk.workspace = true

[lints]
workspace = true
