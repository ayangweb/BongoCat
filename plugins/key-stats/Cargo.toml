[package]
name = "bongocat-plugin-key-stats"
description = "Counts the keys you press and how far the pointer travels, per day, on the BongoCat model window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "key-stats"
path = "src/main.rs"

[dependencies]
bongocat-plugin-sdk.workspace = true
# This plugin keeps a tally between runs, so unlike the other three it does need to
# serialise. The SDK already depends on `serde` and re-exports the derive, so this is one
# line rather than a second version of anything.
serde.workspace = true
# This plugin's own calendar. The host hands a plugin the time of day and no date, so a
# plugin that counts *per day* brings its own date library rather than making the product
# carry one for it. This dependency lands in `plugins/Cargo.lock` and nowhere else, which is
# the whole of what "a plugin maintains its own logic" means when the logic needs a crate.
time = { workspace = true, features = ["parsing", "formatting"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
