[workspace]
resolver = "3"
# One member, added one issue at a time. A plugin that is not written yet is not a
# half-written member of this list: an empty crate is scaffolding, and a crate that
# does not work is worse than one that does not exist.
members = [
    "pomodoro",
    "keyboard-display",
    "typing-sound",
    "key-stats",
    "input-method",
    "agent-watch",
    "cat-skills",
]
# The plugins workspace is deliberately its own. A plugin is built, versioned and
# shipped on its own, and nothing here may reach into the application's manifest:
# adding a plugin must not add a line to `Cargo.lock` next to BongoCat itself,
# because that is the only way "adding a plugin does not grow the app" is a fact
# rather than a promise. See `docs/adr/0079-plugins-are-independent-processes.md`.

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/ayangweb/BongoCat"
publish = false

[workspace.dependencies]
# The only crate a plugin is allowed to depend on. It brings `serde` and the
# protocol with it and nothing else — no GPUI, no platform code, no renderer — so a
# plugin author needs to know nothing about the product's internals to write one.
bongocat-plugin-sdk = { path = "../crates/bongocat-plugin-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
# A plugin that counts per day needs a calendar of its own: the host hands a plugin the
# time of day and no date. Pinned to the same version the product uses so the two
# lockfiles agree about a crate that is in both, and so neither has to explain a
# difference.
time = { version = "=0.3.55", default-features = false, features = ["formatting", "local-offset", "macros", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
